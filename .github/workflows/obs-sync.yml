name: obs-sync

on:
  schedule:
    - cron: "17 4 * * *"          # daily, 04:17 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only report what would be uploaded"
        type: boolean
        default: true
      only:
        description: "Only repos containing this string (e.g. lightcraft)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: obs-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    environment: obs              # secrets OBS_USER / OBS_PASSWORD; restrict to branch main
    timeout-minutes: 300
    env:
      OBS_PROJECT: ${{ vars.OBS_PROJECT }}
      DEBFULLNAME: ${{ vars.DEBFULLNAME }}
      DEBEMAIL: ${{ vars.DEBEMAIL }}
      GH_TOKEN: ${{ github.token }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
      ONLY: ${{ inputs.only }}
    steps:
      - name: Checkout
        run: git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            devscripts debhelper dpkg-dev fakeroot xz-utils jq curl rpm libarchive-tools zstd osc

      - name: Configure osc
        if: env.DRY_RUN != '1'
        env:
          OBS_USER: ${{ secrets.OBS_USER }}
          OBS_PASSWORD: ${{ secrets.OBS_PASSWORD }}
        run: |
          mkdir -p ~/.config/osc
          umask 077
          cat > ~/.config/osc/oscrc <<EOF
          [general]
          apiurl = https://api.opensuse.org

          [https://api.opensuse.org]
          user = ${OBS_USER}
          pass = ${OBS_PASSWORD}
          credentials_mgr_class = osc.credentials.PlaintextConfigFileCredentialsManager
          EOF
          osc api /about >/dev/null

      - name: Sync
        working-directory: repo
        run: scripts/obs-sync.sh

      - name: Commit state (+ monthly heartbeat against the 60-day schedule shutdown)
        if: always() && env.DRY_RUN != '1'
        working-directory: repo
        run: |
          if [ "$(date -u +%d)" = "01" ]; then date -u +%FT%TZ > state/heartbeat.txt; fi
          git add state/
          git diff --cached --quiet && exit 0
          git -c user.name="obs-sync" -c user.email="obs-sync@users.noreply.github.com" \
              commit -m "Update OBS sync state"
          git pull --rebase -q && git push

      - name: Remove credentials
        if: always()
        run: rm -f ~/.config/osc/oscrc
